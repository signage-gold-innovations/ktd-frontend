name: Deploy to Vercel

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+-rc*'  # Preview: v1.0.0-rc, v1.0.0-rc.1, etc.
      - 'v[0-9]+\.[0-9]+\.[0-9]+'      # Production: v1.0.0 (but not -rc, handled by condition)

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  deploy-preview:
    name: Deploy Preview
    needs: lint
    if: contains(github.ref, '-rc')
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build with env vars
        run: |
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy Preview
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
      - name: Notify Discord - Preview
        if: success()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_PREVIEW }} \
            -H 'Content-Type: application/json' \
            -d '{
              "thread_name": "Preview Deployment - ${{ github.ref_name }}",
              "embeds": [{
                "title": "🚀 Preview Deployment Ready",
                "description": "New preview build is live!",
                "color": 3066993,
                "fields": [{
                  "name": "Tag",
                  "value": "`${{ github.ref_name }}`",
                  "inline": true
                }, {
                  "name": "Status",
                  "value": "✅ Success",
                  "inline": true
                }, {
                  "name": "Preview URL",
                  "value": "${{ steps.deploy.outputs.preview_url }}",
                  "inline": false
                }, {
                  "name": "Commit",
                  "value": "`${{ github.sha }}`",
                  "inline": true
                }, {
                  "name": "Branch",
                  "value": "staging",
                  "inline": true
                }, {
                  "name": "Deployed At",
                  "value": "'$(date -u +%Y-%m-%d\ %H:%M:%S)'",
                  "inline": false
                }],
                "footer": {
                  "text": "KTD Frontend - Preview"
                },
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }],
              "components": [{
                "type": 1,
                "components": [{
                  "type": 2,
                  "label": "View Preview",
                  "style": 5,
                  "url": "${{ steps.deploy.outputs.preview_url }}"
                }]
              }]
            }'

  deploy-production:
    name: Deploy Production
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build with env vars
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy Production
        id: deploy_prod
        run: |
          PRODUCTION_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$PRODUCTION_URL" >> $GITHUB_OUTPUT
      - name: Notify Discord - Production
        if: success()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_PRODUCTION }} \
            -H 'Content-Type: application/json' \
            -d '{
              "embeds": [{
                "title": "🎉 Production Deployment Successful",
                "description": "Tag: ${{ github.ref_name }}",
                "color": 15158332,
                "fields": [{
                  "name": "Project",
                  "value": "KTD Frontend",
                  "inline": true
                }, {
                  "name": "Environment",
                  "value": "Production",
                  "inline": true
                }, {
                  "name": "Production URL",
                  "value": "${{ steps.deploy_prod.outputs.production_url }}",
                  "inline": false
                }, {
                  "name": "Commit",
                  "value": "${{ github.sha }}",
                  "inline": true
                }],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'
